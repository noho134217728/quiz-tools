name: Deploy quiz tools to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Convert chem-quiz CSV to JSON
        run: |
          python chem-quiz/csv_to_json.py chem-quiz/reactions.csv chem-quiz/reactions.json

      - name: Convert inorganic-kakuron-quiz CSV to JSON
        run: |
          python inorganic-kakuron-quiz/csv_to_json.py inorganic-kakuron-quiz/reactions.csv inorganic-kakuron-quiz/reactions.json

      - name: Disable Jekyll
        run: touch .nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
