<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小テスト生成器</title>
  <style>
    :root {
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #d1d5db;
      --paper: #ffffff;
      --bg: #f3f4f6;
      --accent: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px;
      background: var(--bg);
      color: var(--ink);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        "Yu Gothic UI",
        sans-serif;
      line-height: 1.7;
    }

    main {
      max-width: 840px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: 0.04em;
    }

    p {
      margin-top: 0;
      color: var(--muted);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 28px;
    }

    .card {
      display: block;
      padding: 24px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(17, 24, 39, 0.06);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(17, 24, 39, 0.10);
    }

    .card-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .card-desc {
      color: var(--muted);
      font-size: 14px;
    }

    .path {
      margin-top: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      color: var(--accent);
    }

    @media (max-width: 720px) {
      body {
        padding: 24px;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>小テスト生成器</h1>
    <p>使用する小テストを選んでください。</p>

    <section class="cards">
      <a class="card" href="./chem-quiz/">
        <div class="card-title">無機化学 化学反応式小テスト</div>
        <div class="card-desc">化学反応式を書き、反応分類を記号で答える形式です。</div>
        <div class="path">chem-quiz/</div>
      </a>

      <a class="card" href="./inorganic-kakuron-quiz/">
        <div class="card-title">無機化学小テスト：各論編</div>
        <div class="card-desc">化学反応式を書き、元素・単元の所属を記号で答える形式です。</div>
        <div class="path">inorganic-kakuron-quiz/</div>
      </a>
    </section>
  </main>
</body>
</html>
